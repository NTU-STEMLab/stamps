site_name: STAMPS

theme:
  name: readthedocs #material 

plugins:
  - search
  - gen-files:
      scripts:
        - gen_ref_pages.py
  - literate-nav:
  - mkdocstrings:
      handlers:
        python:
          paths: [../]

nav:
  - Example Homepage: index.md
  - code reference: reference/

watch:
  - ../stamps/